<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドルフィ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Zen Maru Gothic',sans-serif;
  background:radial-gradient(ellipse at 40% 0%,#0a2540,#040d18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#dff2fb;
}
.wave{position:fixed;bottom:0;left:-100%;width:300%;height:60px;background:rgba(0,140,190,0.07);border-radius:50% 50% 0 0;animation:wave 8s ease-in-out infinite;}
.wave:nth-child(2){bottom:4px;animation-duration:11s;animation-direction:reverse;opacity:.4;}
@keyframes wave{0%,100%{transform:translateX(0);}50%{transform:translateX(10%);}}
.bubbles{position:fixed;inset:0;pointer-events:none;}
.bubble{position:absolute;border-radius:50%;background:rgba(0,200,240,0.08);border:1px solid rgba(0,200,240,0.15);animation:rise linear infinite;}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:.6;}100%{transform:translateY(-100vh) scale(.1);opacity:0;}}

.card{
  background:rgba(0,25,50,0.85);
  border:1px solid rgba(0,200,240,0.22);
  border-radius:24px;
  padding:20px 24px 16px;
  display:flex;flex-direction:column;align-items:center;
  gap:10px;
  backdrop-filter:blur(12px);
  box-shadow:0 0 40px rgba(0,200,240,0.08);
  width:90%;max-width:300px;
}
.app-name{font-size:10px;letter-spacing:.25em;color:#00c8f0;opacity:.5;text-transform:uppercase;}
#dolphin{width:140px;height:140px;filter:drop-shadow(0 0 20px rgba(0,220,255,.45));}

.speech{
  position:relative;
  background:rgba(0,15,40,0.9);
  border:1px solid rgba(0,200,240,0.2);
  border-radius:14px;
  padding:10px 14px;
  width:100%;
  text-align:center;
  font-size:13px;line-height:1.6;
  min-height:44px;
  display:flex;align-items:center;justify-content:center;
}
.speech::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-bottom-color:rgba(0,180,220,.22);border-top:none;}
.speech::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:rgba(0,15,40,.9);border-top:none;}

.hint{font-size:11px;color:rgba(200,230,240,.35);text-align:center;line-height:1.6;}

/* 気分ボタン */
.moods{display:flex;gap:8px;}
.mood-btn{
  flex:1;padding:8px 4px;
  background:rgba(0,200,240,0.08);
  border:1px solid rgba(0,200,240,0.2);
  border-radius:12px;color:#00c8f0;
  font-family:'Zen Maru Gothic',sans-serif;
  font-size:12px;cursor:pointer;
  transition:all .15s;
}
.mood-btn:active{background:rgba(0,200,240,0.2);transform:scale(.96);}
</style>
</head>
<body>
<div class="wave"></div><div class="wave"></div>
<div class="bubbles" id="bubbles"></div>

<div class="card">
  <div class="app-name">🐬 dolphin assistant</div>
  <canvas id="dolphin" width="280" height="280"></canvas>
  <div class="speech"><span id="speech-text">下のチャットで話しかけてね！🌊</span></div>
  <div class="moods">
    <button class="mood-btn" onclick="setMoodBtn('happy')">😊 嬉しい</button>
    <button class="mood-btn" onclick="setMoodBtn('thinking')">🤔 考え中</button>
    <button class="mood-btn" onclick="setMoodBtn('idle')">🌊 普通</button>
  </div>
  <div class="hint">↓ 下のチャット欄でClaudeと話せます</div>
</div>

<script>
// バブル
(()=>{
  const el=document.getElementById('bubbles');
  for(let i=0;i<12;i++){
    const b=document.createElement('div');b.className='bubble';
    const sz=Math.random()*8+3;
    b.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:-10px;animation-duration:${Math.random()*8+5}s;animation-delay:${Math.random()*8}s;`;
    el.appendChild(b);
  }
})();

class Dolphin{
  constructor(canvas,scale=1){
    this.cvs=canvas;this.ctx=canvas.getContext('2d');
    this.s=scale;this.t=0;this.mood='idle';this.moodTimer=0;
    this.blinkTimer=Math.random()*120+60;this.eyeOpen=true;
  }
  setMood(m,d=120){this.mood=m;this.moodTimer=d;}
  draw(){
    const{ctx,s}=this,W=this.cvs.width,H=this.cvs.height;
    ctx.clearRect(0,0,W,H);
    this.t+=0.055;
    if(this.moodTimer>0)this.moodTimer--;else this.mood='idle';
    this.blinkTimer--;
    if(this.blinkTimer<=0){this.eyeOpen=!this.eyeOpen;this.blinkTimer=this.eyeOpen?(Math.random()*130+70):7;}
    const bob=Math.sin(this.t*.8)*5*s;
    const tail=Math.sin(this.t*1.2)*.17+(this.mood==='happy'?Math.sin(this.t*2.8)*.15:0);
    const fin=Math.sin(this.t*1.6)*.09;
    ctx.save();ctx.translate(W/2,H/2+bob);
    ctx.save();ctx.translate(-62*s,0);ctx.rotate(tail);
    ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-24*s,-24*s,-50*s,-17*s,-43*s,4*s);ctx.bezierCurveTo(-50*s,14*s,-24*s,22*s,0,4*s);
    const tg=ctx.createLinearGradient(-50*s,-17*s,0,8*s);tg.addColorStop(0,'#005070');tg.addColorStop(1,'#009ab8');ctx.fillStyle=tg;ctx.fill();ctx.restore();
    ctx.beginPath();ctx.ellipse(8*s,0,77*s,33*s,0,0,Math.PI*2);
    const bg=ctx.createRadialGradient(18*s,-13*s,4*s,8*s,0,77*s);bg.addColorStop(0,'#00d0f0');bg.addColorStop(.45,'#0090b5');bg.addColorStop(1,'#003d5c');ctx.fillStyle=bg;ctx.fill();
    ctx.beginPath();ctx.ellipse(13*s,11*s,47*s,19*s,.08,0,Math.PI*2);ctx.fillStyle='rgba(215,240,252,.6)';ctx.fill();
    ctx.save();ctx.translate(9*s,-33*s);ctx.rotate(fin);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(8*s,-27*s,24*s,-31*s,20*s,-4*s);ctx.bezierCurveTo(12*s,-8*s,4*s,-4*s,0,0);ctx.fillStyle='#006880';ctx.fill();ctx.restore();
    ctx.save();ctx.translate(35*s,9*s);ctx.rotate(.28+fin*.5);ctx.beginPath();ctx.ellipse(0,0,23*s,10*s,.45,0,Math.PI*2);ctx.fillStyle='#007898';ctx.fill();ctx.restore();
    ctx.beginPath();ctx.ellipse(69*s,-4*s,28*s,24*s,-.08,0,Math.PI*2);
    const hg=ctx.createRadialGradient(78*s,-13*s,3*s,69*s,-4*s,28*s);hg.addColorStop(0,'#18dcff');hg.addColorStop(.5,'#00aed4');hg.addColorStop(1,'#00536e');ctx.fillStyle=hg;ctx.fill();
    ctx.beginPath();ctx.ellipse(74*s,-15*s,10*s,5*s,-.28,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fill();
    ctx.beginPath();ctx.moveTo(84*s,-6*s);ctx.bezierCurveTo(112*s,-10*s,120*s,-4*s,118*s,0);ctx.bezierCurveTo(120*s,4*s,112*s,9*s,84*s,5*s);ctx.fillStyle='#009abc';ctx.fill();
    if(this.mood==='talking'){const o=(Math.sin(this.t*9)+1)*3.5*s;ctx.beginPath();ctx.ellipse(101*s,1*s,13*s,o+2*s,0,0,Math.PI*2);ctx.fillStyle='#001e2e';ctx.fill();}
    else{ctx.beginPath();ctx.arc(103*s,-2*s,9*s,.1,Math.PI-.1);ctx.strokeStyle='#003452';ctx.lineWidth=2*s;ctx.stroke();}
    const ex=81*s,ey=-14*s,er=6.5*s;
    ctx.beginPath();ctx.arc(ex,ey,er,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();
    if(this.eyeOpen){
      ctx.beginPath();ctx.arc(ex+1.5*s,ey+1*s,er*.54,0,Math.PI*2);ctx.fillStyle='#001422';ctx.fill();
      ctx.beginPath();ctx.arc(ex+2.5*s,ey-1.2*s,er*.17,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();
      if(this.mood==='happy'){ctx.beginPath();ctx.arc(ex+.5*s,ey,er*.3,0,Math.PI*2);ctx.fillStyle='#ffe040';ctx.fill();}
    }else{
      ctx.beginPath();ctx.moveTo(ex-er*.72,ey);ctx.lineTo(ex+er*.72,ey);ctx.strokeStyle='#001422';ctx.lineWidth=2.5*s;ctx.stroke();
    }
    if(this.mood==='thinking'){
      for(let i=0;i<3;i++){const a=this.t*2.1+i*(Math.PI*2/3);ctx.beginPath();ctx.arc(ex+Math.cos(a)*19*s,ey+Math.sin(a)*19*s-33*s,3.5*s,0,Math.PI*2);ctx.fillStyle=`rgba(0,210,240,${.35+Math.sin(this.t*3+i)*.3})`;ctx.fill();}
    }
    ctx.restore();
  }
  start(){const f=()=>{this.draw();requestAnimationFrame(f);};f();}
}

const d=new Dolphin(document.getElementById('dolphin'),.42);
d.start();
setTimeout(()=>d.setMood('happy',120),600);

// 気分ボタン
const speeches={
  happy:'わーい！嬉しいな🎉',
  thinking:'うーん、考え中…🤔',
  idle:'何でも聞いてね🌊'
};
function setMoodBtn(mood){
  d.setMood(mood, mood==='idle'?1:200);
  document.getElementById('speech-text').textContent=speeches[mood];
}

// Claudeの返答をキャッチして吹き出しに反映
// （将来的にpostMessageで連携可能）
</script>
</body>
</html>
